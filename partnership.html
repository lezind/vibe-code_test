<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제휴·문의 | 로또 패턴 분석실</title>
  <meta name="description" content="로또 패턴 분석실에 제휴 제안, 오류 제보, 자료 문의를 보낼 수 있는 페이지입니다.">
  <link rel="canonical" href="https://lezind.github.io/vibe-code_test/partnership.html">
  <meta name="google-adsense-account" content="ca-pub-6703071507858733">
  <!-- 콘텐츠가 아닌 양식 페이지라 광고 스크립트는 넣지 않는다 (AdSense 고품질 사이트 도움말 2부) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c8102e'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3E45%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #d9dde3;
      --accent: #f0b90b;
      --accent-text: #1a1d23;
      --ok: #15803d;
      --err: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #181b21;
        --text: #e8eaed;
        --muted: #9aa1ac;
        --border: #2c313a;
        --ok: #4ade80;
        --err: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 20px 16px 48px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .lead { margin: 0 0 24px; color: var(--muted); font-size: 0.95rem; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    .req { color: var(--err); }
    .field { margin-bottom: 16px; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    select option { color: #1a1d23; }
    textarea { min-height: 140px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
    .consent { display: flex; gap: 8px; align-items: flex-start; font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    .consent input { width: auto; margin-top: 3px; }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .status { margin-top: 14px; font-size: 0.9rem; min-height: 1.4em; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .hp { position: absolute; left: -9999px; }
    .site-nav, .site-foot { width: 100%; max-width: 520px; }
    .site-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
    .site-nav .brand { font-weight: 800; font-size: 1.1rem; color: var(--text); text-decoration: none; }
    .site-nav nav, .site-foot nav { display: flex; gap: 4px 14px; flex-wrap: wrap; }
    .site-nav nav a { font-size: 0.9rem; color: var(--text); text-decoration: none; padding: 4px 10px; border-radius: 999px; border: 1px solid transparent; }
    .site-nav nav a:hover { border-color: var(--border); }
    .site-nav nav a[aria-current="page"] { border-color: var(--text); }
    .site-foot { font-size: 0.8rem; color: var(--muted); display: grid; gap: 6px; }
    .site-foot a, .consent a { color: inherit; }
  </style>
</head>
<body>
  <header class="site-nav">
    <a class="brand" href="./">로또 패턴 분석실</a>
    <nav aria-label="사이트 메뉴">
      <a href="./">분석</a>
      <a href="guide.html">가이드</a>
      <a href="about.html">소개</a>
      <a href="partnership.html" aria-current="page">문의</a>
    </nav>
  </header>

  <main class="card">
    <h1>제휴·문의</h1>
    <p class="lead">제휴·협업 제안, 오류 제보, 자료 문의를 남겨주시면 검토 후 입력하신 이메일로 연락드리겠습니다.</p>

    <form id="partnership-form" action="https://formspree.io/f/mdeeajdj" method="POST">
      <input type="hidden" name="_subject" value="[제휴 문의] 새 문의가 접수되었습니다">
      <!-- 스팸 방지용 허니팟: 사람에게는 보이지 않음 -->
      <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off">

      <div class="row">
        <div class="field">
          <label for="name">담당자 이름 <span class="req">*</span></label>
          <input id="name" name="name" type="text" required autocomplete="name">
        </div>
        <div class="field">
          <label for="company">회사/단체명</label>
          <input id="company" name="company" type="text" autocomplete="organization">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="email">이메일 <span class="req">*</span></label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="phone">연락처</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel">
        </div>
      </div>

      <div class="field">
        <label for="type">문의 유형 <span class="req">*</span></label>
        <select id="type" name="type" required>
          <option value="">선택해주세요</option>
          <option>사업 제휴</option>
          <option>마케팅·광고</option>
          <option>기술 협력</option>
          <option>투자</option>
          <option>기타</option>
        </select>
      </div>

      <div class="field">
        <label for="message">문의 내용 <span class="req">*</span></label>
        <textarea id="message" name="message" required placeholder="제안 내용, 기대 효과, 일정 등을 자유롭게 적어주세요."></textarea>
      </div>

      <label class="consent">
        <input type="checkbox" name="privacy_consent" value="동의" required>
        <span>문의 응대를 위해 입력한 개인정보(이름, 이메일, 연락처)를 수집·이용하는 데 동의합니다. 답변 완료 후 1년간 보관하며, 자세한 내용은 <a href="privacy.html" target="_blank">개인정보처리방침</a>을 확인해 주세요. <span class="req">*</span></span>
      </label>

      <button type="submit">문의 보내기</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-foot">
    <nav aria-label="하단 메뉴">
      <a href="about.html">사이트 소개</a>
      <a href="guide.html">로또 가이드</a>
      <a href="privacy.html">개인정보처리방침</a>
    </nav>
    <span>© 2026 로또 패턴 분석실</span>
  </footer>

  <script>
    // JS가 켜져 있으면 페이지 이동 없이 전송, 꺼져 있으면 일반 POST로 Formspree 페이지에서 처리됨
    const form = document.getElementById('partnership-form');
    const statusEl = document.getElementById('status');
    const button = form.querySelector('button');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.className = 'status';
      statusEl.textContent = '전송 중…';
      button.disabled = true;

      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { Accept: 'application/json' },
        });
        if (res.ok) {
          form.reset();
          statusEl.className = 'status ok';
          statusEl.textContent = '문의가 접수되었습니다. 감사합니다!';
        } else {
          const data = await res.json().catch(() => ({}));
          const msg = data.errors ? data.errors.map((er) => er.message).join(', ') : '';
          throw new Error(msg || '전송에 실패했습니다.');
        }
      } catch (err) {
        statusEl.className = 'status err';
        statusEl.textContent = (err.message || '전송에 실패했습니다.') + ' 잠시 후 다시 시도해주세요.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
