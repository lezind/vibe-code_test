<script>
  const md = "# 바이낸스 현물 자동매매 봇 (초보자용)\n\nTradingView에서 가져온 전략대로 바이낸스 **현물**을 자동으로 사고팔고, 매매 현황을 **슬랙**(또는 텔레그램)으로 알려 주는 봇입니다.\n진짜 돈은 맨 마지막 단계에서만 씁니다. 순서대로 따라오세요.\n\n| 단계 | 하는 일 | 돈 | API 키 |\n|---|---|---|---|\n| 1~2 | 설치하고 자체 테스트 | 없음 | 필요 없음 |\n| 3 | 슬랙 알림 연결 | 없음 | 필요 없음 |\n| 4 | 전략 확인 (차트와 비교, 과거 계산) | 없음 | 필요 없음 |\n| 5 | 모의매매 (실제 시세, 가짜 돈) | 없음 | 필요 없음 |\n| 6 | 테스트넷 (주문 절차 연습) | 가짜 돈 | 테스트넷 키 |\n| 7 | 실전 | **진짜 돈** | 실전 키 |\n\n## 파일 설명\n\n| 파일 | 역할 | 고칠 일 |\n|---|---|---|\n| `.env` | 내 설정과 비밀 키 (직접 만듦) | 자주 |\n| `strategy.py` | 언제 사고 팔지 (TradingView 지표를 옮긴 전략) | 전략 설정 바꿀 때 |\n| `backtest.py` | 차트와 신호 비교, 과거 매매 계산 | 없음 |\n| `bot.py` | 봇 본체, 안전장치, 알림 | 거의 없음 |\n| `exchange.py` | 바이낸스 시세·주문 | 없음 |\n| `notifier.py` | 슬랙·텔레그램 전송 | 없음 |\n| `config.py` | `.env` 읽기 | 없음 |\n| `selftest.py` | 설치 확인용 테스트 | 없음 |\n| `notify_setup.py` | 알림 설정 도우미 | 없음 |\n| `security_check.py` | 보안 점검 | 없음 |\n\n실행하면 생기는 파일: `state.json`(보유 기록), `trades.csv`(매매 내역, 엑셀로 열림), `logs/bot.log`(실행 기록)\n\n---\n\n## 1. 설치\n\n1. 이 폴더를 **클라우드 동기화가 안 되는 곳**에 둡니다. 예: `C:\\bots\\binance-bot`\n   (바탕화면·문서 폴더는 OneDrive로 동기화되는 경우가 많아, 키가 클라우드에 복사됩니다)\n2. VS Code에서 `파일 > 폴더 열기`로 이 폴더를 엽니다.\n3. `터미널 > 새 터미널`을 열고 아래를 입력합니다.\n\n```\npython -m pip install -r requirements.txt\n```\n\n## 2. 자체 테스트\n\n```\npython selftest.py\n```\n\n마지막 줄에 `모든 테스트 통과`가 나오면 됩니다. 인터넷이나 키 없이 가짜 시세로 매수·손절·안전장치를 확인합니다.\n\n## 3. 슬랙 알림 연결\n\n먼저 `.env.example` 파일을 복사해서 이름을 `.env`로 바꿉니다. (VS Code 왼쪽 목록에서 복사·붙여넣기 후 이름 변경)\n\n### 웹훅 주소 만들기\n\n1. 슬랙에서 알림을 받을 채널을 정합니다. 매매 금액이 보이므로 **나만 있는 비공개 채널**을 새로 만드는 것을 권합니다. (예: `#coin-bot`)\n2. 브라우저에서 https://api.slack.com/apps 에 들어가 `Create New App` > `From scratch`를 누릅니다.\n3. 앱 이름(예: `coin-bot`)을 적고 내 워크스페이스를 고른 뒤 `Create App`을 누릅니다.\n4. 왼쪽 메뉴의 `Incoming Webhooks`에 들어가 `Activate Incoming Webhooks`를 `On`으로 켭니다.\n5. 아래쪽 `Add New Webhook to Workspace`를 누르고, 1번에서 정한 채널을 골라 허용합니다.\n6. `https://hooks.slack.com/services/...`로 시작하는 주소가 생깁니다. 복사해서 `.env`의 `SLACK_WEBHOOK_URL=` 뒤에 붙여 넣고 저장합니다.\n\n회사 슬랙은 관리자 승인이 있어야 앱을 만들 수 있는 경우가 있고, 매매 알림이 회사 기록에 남습니다. 개인용 무료 워크스페이스를 따로 만들어 쓰는 편이 안전합니다.\n\n### 테스트\n\n```\npython notify_setup.py\n```\n\n`슬랙: 전송 성공`이 나오고 채널에 테스트 메시지가 오면 됩니다. 휴대폰 슬랙 앱에서 그 채널의 알림을 `모든 새 메시지`로 바꿔 두면 매매 때마다 푸시가 옵니다.\n\n웹훅 주소는 그 채널에 글을 쓰는 것만 할 수 있습니다. 채널의 다른 글을 읽거나 봇을 조종하는 데는 쓸 수 없습니다.\n\n### 텔레그램도 쓰고 싶다면 (선택)\n\n슬랙과 함께 쓰거나 대신 쓸 수 있습니다. `.env`에 채워진 곳으로 모두 보냅니다.\n\n1. 텔레그램에서 `@BotFather`를 검색해 `/newbot`을 보내고, 받은 토큰을 `.env`의 `TELEGRAM_BOT_TOKEN=`에 넣습니다.\n2. 방금 만든 내 봇에게 아무 말이나 한 번 보냅니다.\n3. `python notify_setup.py`를 실행해 화면에 나온 숫자를 `TELEGRAM_CHAT_ID=`에 넣고, 한 번 더 실행해 테스트합니다.\n\n## 4. 전략 확인\n\n`strategy.py`에는 TradingView 지표 **Smart Algo Signals Suite [AlgoChief]** 의 계산이 파이썬으로 옮겨져 있습니다.\n\n### 봇이 사고파는 규칙 (기본값)\n\n| 상황 | 봇의 행동 |\n|---|---|\n| 차트에 ▲ 또는 +▲ 신호 | 매수 (보유 중이면 무시) |\n| 차트에 ▼ 또는 +▼ 신호 | 보유분 전량 매도 |\n| 가격이 SL 선에 닿음 (신호 캔들 종가 - ATR × 1.5) | 전량 매도 |\n| 가격이 TP3 선에 닿음 (신호 캔들 종가 + ATR × 3) | 전량 매도 |\n| ✕ 표시, ● 재진입 점 | 사용 안 함 (설정으로 켤 수 있음) |\n\n지표는 TP를 3단계로 그리지만 봇은 나눠 팔지 않고 한 번에 전부 팝니다. 어느 TP에서 팔지는 `TP_TARGET`으로 정합니다.\n\n### 설정 맞추기\n\n1. `.env`의 `SYMBOL`, `TIMEFRAME`을 TradingView 차트와 똑같이 맞춥니다.\n2. TradingView에서 지표 설정을 바꿔 쓰고 있다면 `strategy.py` 위쪽 **1. 지표 설정**의 값을 똑같이 고칩니다. (기본값 그대로 쓰면 고칠 것 없음)\n3. 사고파는 규칙을 바꾸려면 **2. 봇 매매 규칙**을 고칩니다. 예: 강한 신호(+▲)에서만 사려면 `ENTRY_TRIGGER = \"strong\"`\n\n### 차트와 비교하기\n\n```\npython backtest.py\n```\n\n두 가지가 나옵니다.\n\n1. **최근 신호 목록**: TradingView 차트의 같은 캔들에 같은 ▲▼ 표시가 있는지 비교합니다. 차트는 `BINANCE` 거래소의 현물 종목, 같은 캔들 주기, 시간대 서울(UTC+9)로 맞춰야 합니다. 서너 개만 확인해도 충분합니다.\n2. **과거 매매 계산**: 같은 규칙으로 과거에 매매했다면 몇 번 사고팔았고 손익이 어땠는지 보여 줍니다. 더 긴 기간은 `python backtest.py 6000`처럼 캔들 수를 적습니다.\n\n신호가 차트와 다르면 고치지 말고 다른 자리의 시각과 차트 화면 설명을 Claude에게 알려 주세요.\n\n알아둘 점\n- 이 지표는 TradingView의 \"전략\"이 아니라 \"지표\"라서 TradingView에 수익률 보고서가 없습니다. 과거 성과는 `backtest.py` 결과가 유일한 근거이고, 과거 결과가 앞으로도 이어진다는 보장은 없습니다.\n- ▲▼ 신호와 SL/TP 가격은 차트와 같게 나오도록 옮겼습니다. ✕ 표시와 +▲(강한 신호) 구분은 차트와 일부 다를 수 있습니다. 원본 코드가 이 둘을 TradingView에서 일부 캔들에서만 계산되는 방식으로 작성해 두었기 때문입니다. 그래서 기본 규칙에는 넣지 않았습니다.\n- 손절 폭(ATR × 1.5)이 좁을 때는 왕복 수수료(약 0.2%)가 손익에서 차지하는 비중이 커집니다. 과거 매매 계산의 수수료 합계를 함께 보세요.\n- 이 봇은 현물 매수만 합니다. ▼ 신호는 공매도가 아니라 보유분 매도입니다.\n- `.env`의 `STOP_LOSS_PCT`도 함께 적용됩니다. 지표의 SL 가격과 비교해 먼저 닿는 쪽에서 팝니다.\n\n## 5. 모의매매\n\n`.env`의 `MODE=paper` 그대로 두고 실행합니다.\n\n```\npython bot.py\n```\n\n- 멈출 때: 터미널에서 `Ctrl + C`\n- 급히 멈출 때: 폴더에 `STOP.txt`라는 빈 파일을 만들면 다음 확인 때 멈춥니다.\n- 봇은 **PC가 켜져 있고 절전 상태가 아닐 때만** 동작합니다.\n- 봇은 켜진 뒤에 마감되는 캔들부터 판단합니다. `TIMEFRAME=1h`면 첫 판단까지 최대 1시간 걸리고, 그 뒤 ▲ 신호가 나와야 첫 매수를 합니다. 며칠 동안 매매가 없을 수도 있습니다.\n\n오는 알림: 봇 시작/정지, 매수·매도 체결(가격·수량·손익·이유·손절가·익절가), 6시간마다 현황, 하루 마감 요약, 오류.\n시작할 때 터미널에 `알림 보낼 곳: 슬랙`이 보이면 연결된 것입니다.\n\n**최소 1~2주는 모의매매로 지켜보세요.** 알림과 `trades.csv`를 TradingView 차트와 비교해 봇이 차트 표시대로 움직이는지 확인합니다.\n\n### 다른 전략으로 바꾸고 싶을 때\n\nTradingView에서 지표나 전략의 `소스 코드`를 복사해 Claude에게 보여 주면 `strategy.py`를 새로 옮겨 드립니다. 소스가 공개된 것만 가능하고, 자물쇠 표시(보호됨/초대 전용)는 코드를 볼 수 없습니다.\n\nTradingView 알림(웹훅)을 받아 주문하는 방식도 있지만, TradingView 유료 요금제와 2단계 인증, 그리고 인터넷에 공개된 서버가 필요합니다. 외부에서 들어오는 문을 여는 구조라 보안 부담이 커서, 이 봇은 전략을 내 PC에서 직접 계산합니다. 밖에서 봇으로 들어오는 통로가 없습니다.\n\n## 6. 테스트넷\n\n가짜 돈으로 실제 주문 절차(체결, 수수료, 잔고)를 연습합니다.\n\n1. https://testnet.binance.vision 에 로그인해 HMAC 키를 발급받습니다.\n2. `.env`에 `TESTNET_API_KEY`, `TESTNET_API_SECRET`을 넣고 `MODE=testnet`으로 바꿉니다.\n3. `python bot.py`\n\n테스트넷 시세는 실제와 다르고 주기적으로 초기화됩니다. 전략 성능이 아니라 **주문이 문제없이 나가는지**만 봅니다.\n\n## 7. 실전\n\n모의매매와 테스트넷에서 문제가 없었을 때만 진행하세요.\n\n### API 키 만들기 (바이낸스 > 프로필 > API 관리)\n\n- [ ] 권한은 **읽기**와 **현물 거래**만 켭니다.\n- [ ] **출금 권한은 끕니다.** (가장 중요: 키가 새어도 돈을 빼 갈 수 없습니다)\n- [ ] 선물, 마진, 옵션, 이체 권한은 모두 끕니다.\n- [ ] **IP 접근 제한**을 켜고 내 PC의 공인 IP만 넣습니다. (네이버에서 \"내 IP\" 검색)\n- [ ] 시크릿 키는 만들 때 한 번만 보입니다. 바로 `.env`에 넣습니다.\n\n### 켜기\n\n1. `.env`에 `BINANCE_API_KEY`, `BINANCE_API_SECRET`을 넣습니다.\n2. `python security_check.py`를 실행해 `[위험]`이 없는지 확인합니다.\n3. `ORDER_USDT`를 **잃어도 괜찮은 작은 금액**으로 둡니다.\n4. `MODE=live`, `LIVE_CONFIRM=YES_REAL_MONEY`로 바꾸고 `python bot.py`\n\n봇은 시작할 때 키 권한을 직접 조회해서, 출금 권한이 켜져 있거나 IP 제한이 꺼져 있으면 실전을 시작하지 않습니다.\n\n---\n\n## 안전장치 요약\n\n| 장치 | 내용 |\n|---|---|\n| 현물만 | 선물·마진·레버리지·출금 코드가 아예 없습니다 |\n| 포지션 1개 | 한 번에 `ORDER_USDT`만큼만 삽니다. 물타기·추가 매수 없음 |\n| 손절 | 지표의 SL 가격 또는 진입가 대비 `STOP_LOSS_PCT`% 하락 중 먼저 닿는 쪽에서 시장가 매도 |\n| 하루 한도 | 매수 횟수(`MAX_TRADES_PER_DAY`), 손실 금액(`DAILY_LOSS_LIMIT_USDT`) |\n| 중복 주문 방지 | 봇 2개 동시 실행 차단. 주문 중 통신이 끊기면 재주문하지 않고 정지 |\n| 내 코인 보호 | 봇이 산 수량만 팝니다. 원래 갖고 있던 코인은 건드리지 않습니다 |\n| 비밀 보호 | 키는 `.env`에만. 로그와 알림에서 자동으로 가립니다 |\n\n손절은 \"그 가격에 팔아 준다\"는 보장이 아닙니다. 급락하면 손절가보다 낮은 가격에 팔릴 수 있습니다.\n\n## 보안 수칙\n\n1. `.env` 파일과 그 내용을 누구에게도 보내지 않습니다. 화면 캡처, 깃허브, 카카오톡, AI 채팅 모두 포함입니다.\n2. 바이낸스 계정에 2단계 인증(OTP 또는 패스키)을 켜고, 출금 주소 화이트리스트와 피싱 방지 코드를 설정합니다.\n3. 키가 노출된 것 같으면 바이낸스 API 관리에서 **즉시 삭제**하고 새로 만듭니다.\n4. 슬랙 웹훅 주소와 텔레그램 봇 토큰도 비밀입니다. 웹훅 주소가 노출되면 슬랙 앱 설정의 `Incoming Webhooks`에서 해당 주소를 삭제하고 새로 만듭니다. 텔레그램 토큰은 BotFather에서 `/revoke`로 재발급합니다.\n5. 인터넷에서 받은 \"수익 보장 봇\"이나 출처 모를 파이썬 패키지를 이 PC에 설치하지 않습니다.\n6. 집 인터넷은 공유기를 껐다 켜면 IP가 바뀔 수 있습니다. 봇이 \"API 키가 거부됐습니다\"로 멈추면 바이낸스의 IP 제한을 새 IP로 고칩니다.\n\n## 문제 해결\n\n| 증상 | 해결 |\n|---|---|\n| `python`을 찾을 수 없음 | VS Code 오른쪽 아래에서 파이썬 인터프리터를 선택하거나 `py bot.py`로 실행 |\n| `No module named ...` | `python -m pip install -r requirements.txt` 다시 실행 |\n| `[설정 오류]` | 메시지에 나온 `.env` 항목을 고칩니다 |\n| `이미 실행 중인 봇이 있습니다` | 다른 터미널에서 돌고 있는 봇을 먼저 끕니다 |\n| `API 키가 거부됐습니다` | 키/시크릿 오타, `MODE`와 키 종류 불일치, IP 변경을 확인 |\n| `주문 결과를 확인하지 못했습니다` | 바이낸스 앱에서 주문 내역을 확인. 체결됐으면 직접 정리 후 `state.json` 삭제하고 재시작 |\n| 알림이 안 옴 | `python notify_setup.py`로 테스트. 슬랙은 휴대폰 앱의 채널 알림 설정도 확인 |\n\n이 봇은 설정한 규칙을 자동으로 실행하는 도구이며 수익을 보장하지 않습니다. 투자 판단과 결과의 책임은 본인에게 있습니다.\n";
